<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>续在 · 数字记忆</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f3ef;color:#253b36;font:15px/1.6 system-ui,sans-serif}header{padding:22px 5%;border-bottom:1px solid #dddcd3;display:flex;align-items:center;justify-content:space-between}h1{font-size:24px;margin:0}h2{font-size:20px;margin:0 0 16px}small,.muted{color:#728079}.badge{border:1px solid #cbd4cb;padding:5px 12px;border-radius:30px;font-size:12px}main{max-width:1200px;margin:36px auto;padding:0 24px}.intro{font-size:32px;letter-spacing:1px;margin:8px 0}.grid{display:grid;grid-template-columns:340px 1fr;gap:24px;margin-top:26px}.card{background:#fff;border:1px solid #e1e4dc;border-radius:22px;padding:24px;margin-bottom:20px}label{display:block;margin:12px 0 5px;font-size:13px}input,textarea{width:100%;padding:11px;border:1px solid #d5ddd6;border-radius:10px;font:inherit;background:#fbfcf9}textarea{resize:vertical;min-height:80px}button{background:#2d594a;color:white;border:0;border-radius:10px;padding:11px 18px;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.secondary{background:#e9eee6;color:#2d594a}form button{margin-top:12px}.chat{height:460px;overflow-y:auto;background:#f8f9f5;padding:16px;border-radius:14px}.bubble{max-width:90%;padding:12px 16px;border-radius:14px;background:#e7eee6;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{margin-left:auto;background:#2d594a;color:white}.bubble small{display:block;color:inherit;opacity:.7;font-size:11px}.empty{padding:60px 12px;text-align:center;color:#78877e}.memory{padding:12px 0;border-bottom:1px solid #e7e9e2;white-space:pre-wrap;overflow-wrap:anywhere}.memory small{display:block}#notice{min-height:26px;position:sticky;top:0;background:#f4f3ef;color:#9a422c}footer{padding:20px 0;color:#728079;font-size:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}.intro{font-size:26px}header{padding:18px}.chat{height:360px}.card{padding:18px}main{padding:0 14px}}</style>
<header><h1>续在 <small>STILLHERE</small></h1><span class="badge" id="mode">正在加载</span></header><main><p class="muted">让经历被记住，让故事继续被听见。</p><div class="intro">从一段记忆，开始认识一个人。</div><p class="muted">开发中 · 记忆索引 · 人物档案 / 记忆库 / 持久对话</p><div id="notice" role="status" aria-live="polite"></div><div class="grid"><aside><section class="card"><h2>人物档案</h2><form id="profile"><label for="name">姓名或称呼</label><input id="name" required maxlength="80" placeholder="希望如何称呼这位人物"><label for="bio">人生简介</label><textarea id="bio" maxlength="5000" placeholder="成长经历、职业、重要的人……"></textarea><label for="style">说话习惯</label><textarea id="style" maxlength="2000" placeholder="常用语、性格、表达方式"></textarea><button>保存档案</button></form></section><section class="card"><h2>记录一段记忆</h2><form id="memory"><label for="date">发生日期（可选）</label><input type="date" id="date"><label for="memoryText">记忆内容</label><textarea id="memoryText" required maxlength="5000" placeholder="发生了什么？和谁在一起？当时是什么感受？"></textarea><button>保存记忆</button></form></section></aside><div><section class="card"><h2>与记忆对话</h2><p class="muted" id="explanation"></p><div id="chat" class="chat" aria-live="polite"></div><form id="message"><label for="messageText">你的消息</label><textarea id="messageText" required maxlength="5000" placeholder="聊聊曾经的故事……"></textarea><button>发送消息</button></form></section><section class="card"><h2>人生记忆 <small id="count"></small></h2><div id="memories"></div><button class="secondary" id="export" style="margin-top:18px">导出全部资料</button></section></div></div><footer>这是 AI 人物记忆助手开发版。资料保存在当前电脑。当前版本未接入声音复刻、摄像头识别和真人视频通话。</footer></main>
<script type="module" src="/client.js"></script></html>
