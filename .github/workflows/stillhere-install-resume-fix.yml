name: Publish installation resume fix
on:
  push:
    branches: [stillhere-install-resume-fix]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify archive
        working-directory: downloads/dev32-e2
        run: sha256sum --check Stillhere-dev32-install-resume-SHA256.txt
      - name: Publish repair
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view stillhere-dev32-e2 >/dev/null 2>&1; then
            gh release create stillhere-dev32-e2 --target "$GITHUB_SHA" --title "dev32-E2 安装继续修复" --prerelease --notes-file downloads/dev32-e2/README.md
          fi
          gh release upload stillhere-dev32-e2 downloads/dev32-e2/Stillhere-dev32-install-resume-fix.zip downloads/dev32-e2/Stillhere-dev32-install-resume-acceptance.md downloads/dev32-e2/Stillhere-dev32-install-resume-SHA256.txt --clobber
