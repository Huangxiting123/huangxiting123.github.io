name: Publish E-drive integrated package
on:
  push:
    branches: [stillhere-e-drive-integrated]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify complete integrated archive
        run: python3 downloads/dev32-e-integrated/assemble.py
      - name: Publish integrated package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view stillhere-dev32-e-integrated >/dev/null 2>&1; then
            gh release create stillhere-dev32-e-integrated --target "$GITHUB_SHA" --title "dev.32 E盘修复整合版" --prerelease --notes-file downloads/dev32-e-integrated/README.md
          fi
          gh release upload stillhere-dev32-e-integrated downloads/dev32-e-integrated/dist/Stillhere-dev32-E-drive-integrated-Windows-x64.zip downloads/dev32-e-integrated/Stillhere-dev32-E-drive-integrated-acceptance.md downloads/dev32-e-integrated/Stillhere-dev32-E-drive-integrated-SHA256.txt --clobber
