name: Publish STILLHERE dev32 package
on:
  push:
    branches: [stillhere-downloads-dev32]
permissions:
  contents: write
concurrency:
  group: stillhere-dev32-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify and reassemble prepared package
        run: python3 downloads/dev32/assemble.py
      - name: Publish verified prerelease files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view stillhere-dev32 >/dev/null 2>&1; then
            gh release create stillhere-dev32 --target "$GITHUB_SHA" --title "续在 STILLHERE dev.32：本人信息与声音对话原型" --prerelease --notes-file downloads/dev32/release-notes.md
          fi
          gh release upload stillhere-dev32 downloads/dev32/dist/Stillhere-dev32-Windows-x64.zip downloads/dev32/Stillhere-dev32-acceptance.md downloads/dev32/Stillhere-dev32-SHA256.txt --clobber
